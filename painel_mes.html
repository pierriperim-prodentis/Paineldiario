var JSONBIN_ID='6a84b2f1f5f4af5e2925aa5f';
var JSONBIN_KEY='$2a$10$kDShjgaHn/S8k124l8ehU.lw9To/Dt0VHer/KXhF6XMT2CvljlxKm';
var MN_FULL=['','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

function syncFromCloud(){
  return fetch('https://api.jsonbin.io/v3/b/'+JSONBIN_ID+'/latest',{headers:{'X-Master-Key':JSONBIN_KEY}})
    .then(function(r){return r.json();})
    .then(function(json){
      var rec=json&&json.record;
      if(!rec||!rec.data)return;
      var parts=rec.data.split('-');
      var ano=+parts[0],mes=+parts[1];
      var dataBR=parts[2]+'/'+parts[1]+'/'+parts[0];
      var assessores=rec.assessores||{};
      var lojas=rec.lojas||{};
      var somaMeta=0,somaFat=0,somaFab=0;

      Object.keys(assessores).forEach(function(nome){
        var a=assessores[nome];
        var pmw=+a.pmw||0,slz=+a.slz||0,itz=+a.itz||0,fab=+a.fab||0,meta=+a.meta||0,mc=+a.mc||0;
        var fatLoja=pmw+slz+itz;
        somaMeta+=meta;somaFat+=fatLoja;somaFab+=fab;
        var novo={v:nome,a:ano,m:mes,mes:MN_FULL[mes],meta:meta,fat:fatLoja,fat_loja:fatLoja,fat_fab:fab,rent:mc/100,premio:0,pmw:pmw,slz:slz,itz:itz,atualizado:'Atualizado em '+dataBR};
        var idx=META_DATA.findIndex(function(r){return r.v===nome&&r.a===ano&&r.m===mes;});
        if(idx>=0)META_DATA[idx]=novo;else META_DATA.push(novo);
        var jaExiste=HIST.some(function(h){return h.v===nome&&h.a===ano&&h.m===mes&&h.d===rec.data;});
        if(!jaExiste)HIST.push({v:nome,a:ano,m:mes,d:rec.data,pmw:pmw,slz:slz,itz:itz,fab:fab,tot:fatLoja+fab});
      });

      if(Object.keys(lojas).length){
        var pmwL=lojas.PMW||{},slzL=lojas.SLZ||{},itzL=lojas.ITZ||{};
        var ljNovo={v:'_LOJA',a:ano,m:mes,mes:MN_FULL[mes],meta:somaMeta,fat:somaFat,fat_loja:0,fat_fab:somaFab,rent:0,premio:0,
          pmw:+pmwL.loja||0,slz:+slzL.loja||0,itz:+itzL.loja||0,
          pmw_meta:+pmwL.meta||0,slz_meta:+slzL.meta||0,itz_meta:+itzL.meta||0,
          pmw_mc:(+pmwL.mc||0)/100,slz_mc:(+slzL.mc||0)/100,itz_mc:(+itzL.mc||0)/100,
          pmw_fab:+pmwL.fab||0,slz_fab:+slzL.fab||0,itz_fab:+itzL.fab||0,
          atualizado:'Atualizado em '+dataBR};
        var li=META_DATA.findIndex(function(r){return r.v==='_LOJA'&&r.a===ano&&r.m===mes;});
        if(li>=0)META_DATA[li]=ljNovo;else META_DATA.push(ljNovo);
      }
    })
    .catch(function(e){console.warn('Sync com jsonbin falhou:',e);});
}
